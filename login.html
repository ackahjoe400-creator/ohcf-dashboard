<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #2c3e50, #1a2a3a);
      font-family: 'Arial', system-ui, -apple-system, sans-serif;
      padding: 1rem;
    }
    .login-box {
      background: white;
      padding: 2rem;
      border-radius: 1rem;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 20px 35px rgba(0,0,0,0.2);
      text-align: center;
    }
    .login-box h2 { margin-bottom: 1.5rem; color: #2c3e50; font-weight: 600; }
    input {
      width: 100%;
      padding: 0.75rem 1rem;
      margin-top: 0.5rem;
      border: 1px solid #ddd;
      border-radius: 0.5rem;
      font-size: 1rem;
    }
    input:focus {
      outline: none;
      border-color: #27ae60;
      box-shadow: 0 0 0 3px rgba(39,174,96,0.2);
    }
    button {
      width: 100%;
      padding: 0.75rem;
      margin-top: 1.25rem;
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #219653; }
    button:active { transform: scale(0.98); }
    #error { margin-top: 1rem; font-size: 0.9rem; min-height: 2rem; color: #e74c3c; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <input type="password" id="password" placeholder="Enter admin password" autocomplete="off" required>
      <button type="submit" id="loginBtn">Login</button>
      <p id="error"></p>
    </form>
  </div>

  <script>
    (function() {
      const form = document.getElementById('loginForm');
      const passwordInput = document.getElementById('password');
      const errorEl = document.getElementById('error');
      const loginBtn = document.getElementById('loginBtn');

      // Redirect if already logged in
      if (localStorage.getItem('auth') === 'true') {
        window.location.href = 'admin.html';
        return;
      }

      async function handleLogin(event) {
        event.preventDefault();
        const password = passwordInput.value.trim();
        if (!password) {
          errorEl.textContent = 'Please enter the password.';
          return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent = 'Logging in...';
        errorEl.textContent = '';

        try {
          // ✅ Use relative path for deployment compatibility
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password })
          });

          if (!response.ok) throw new Error(`Server error: ${response.status}`);

          const data = await response.json();
          if (data.success) {
            localStorage.setItem('auth', 'true');
            window.location.href = 'admin.html';
          } else {
            errorEl.textContent = 'Wrong password!';
            passwordInput.value = '';
            passwordInput.focus();
          }
        } catch (err) {
          console.error('Login error:', err);
          errorEl.textContent = 'Connection error. Please try again later.';
        } finally {
          loginBtn.disabled = false;
          loginBtn.textContent = 'Login';
        }
      }

      form.addEventListener('submit', handleLogin);
      passwordInput.addEventListener('input', () => { errorEl.textContent = ''; });
    })();
  </script>
</body>
</html>
